<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14302a">
<title>Spider Friends</title>
<link rel="icon" id="icon" href="/spider.svg">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body data-view="home">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="spider" viewBox="-50 -50 100 100">
    <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-6,-15 -18,-32 -30,-44"/><polyline points="6,-15 18,-32 30,-44"/>
      <polyline points="-8,-11 -27,-22 -44,-26"/><polyline points="8,-11 27,-22 44,-26"/>
      <polyline points="-8,-6 -27,-2 -43,10"/><polyline points="8,-6 27,-2 43,10"/>
      <polyline points="-6,-2 -21,13 -31,36"/><polyline points="6,-2 21,13 31,36"/>
    </g>
    <circle cx="0" cy="-10" r="10" fill="currentColor"/>
    <ellipse cx="0" cy="17" rx="15" ry="19" fill="currentColor"/>
    <path d="M0,6 l-5,8 l5,8 l5,-8 z M0,24 l-3,5 l3,4 l3,-4 z" fill="var(--spider-mark, #c22)"/>
    <circle cx="-4" cy="-14" r="2.2" fill="var(--spider-eye, #fff)"/><circle cx="4" cy="-14" r="2.2" fill="var(--spider-eye, #fff)"/>
  </symbol>
  <!-- FreeCell's mark: a king's crown. -->
  <symbol id="crown" viewBox="-50 -50 100 100">
    <path d="M-36,18 L-43,-20 L-20,-2 L0,-32 L20,-2 L43,-20 L36,18 Z" fill="currentColor" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-36" y="25" width="72" height="11" rx="4" fill="currentColor"/>
    <circle cx="0" cy="4" r="5" fill="var(--spider-mark, #c22)"/>
  </symbol>
</svg>

<header id="bar">
  <button class="logo" id="b-logo" title="Home">
    <span class="thread"></span><svg class="hanging"><use class="mascot" href="#spider"/></svg>
    <span class="word">Spider Friends</span>
  </button>
  <div id="info"></div>
  <nav>
    <button id="b-new" title="Daily challenges and new games (n)">New</button>
    <button id="b-undo" title="Undo (u)">Undo</button>
    <button id="b-redo" title="Redo (r)">Redo</button>
    <button id="b-hint" title="Hint (Tab)">Hint</button>
    <button id="b-menu" title="Menu" aria-label="Menu">☰</button>
  </nav>
</header>

<main id="board"></main>
<main id="page"></main>

<footer id="tray">
  <div id="done"></div>
  <div id="fate" class="lost" hidden title="Undo to go back">Unwinnable</div>
  <div id="msg" aria-live="polite"></div>
  <button id="b-finish" class="primary" hidden title="Auto-complete (a)">Auto-complete</button>
  <div id="stock" title="Deal (d)"></div>
</footer>

<div id="dangler" hidden><span class="thread"></span><svg><use class="mascot" href="#spider"/></svg></div>
<dialog id="dialog"></dialog>
</body>
</html>
