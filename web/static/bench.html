<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analysis Benchmark</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #14211d; color: #e8e6df; font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 6px 0; color: #b9b6ad; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  button, select { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #ffffff33; background: #2b3834; color: inherit; }
  button.go { background: #ffd54a; color: #222; border: 0; font-weight: 600; }
  button:disabled { opacity: 0.5; }
  pre { white-space: pre-wrap; word-break: break-word; background: #0008; padding: 12px; border-radius: 8px; font: 12px/1.45 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<h1>Analysis benchmark</h1>
<p>Times the analysis's work on this device: on the page, in one worker, in several at once, then a whole analysis. Keep the screen on and this tab in front until it says done (a minute or two), then copy the report.</p>
<div class="row">
  <label>Suits <select id="suits"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></label>
  <button class="go" id="go">Run</button>
  <button id="quick">Quick (no full analysis)</button>
  <button id="copy">Copy report</button>
</div>
<pre id="out"></pre>
<script type="module">
import { suite, played, stretchJob } from '/bench-worker.js';
import { fastConfig } from '/lineplayer.js';
import { prepare, stretchValues, screenJobs, screen, findMistakes } from '/analysis-core.js';

const out = document.getElementById('out');
const log = s => { out.textContent += s + '\n'; };
const cores = navigator.hardwareConcurrency || 0;
const SEED = 70018;
let hidden = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) hidden++; });

function env() {
  const lines = [
    `when      ${new Date().toISOString()}`,
    `agent     ${navigator.userAgent}`,
    `platform  ${navigator.userAgentData ? JSON.stringify({ platform: navigator.userAgentData.platform, mobile: navigator.userAgentData.mobile, brands: navigator.userAgentData.brands.map(b => `${b.brand} ${b.version}`).join(', ') }) : navigator.platform}`,
    `cores     ${cores || '(not said)'}   memory ${navigator.deviceMemory ?? '?'} GB   isolated ${self.crossOriginIsolated}`,
    `screen    ${window.screen.width}x${window.screen.height} @${devicePixelRatio}`,
  ];
  if (navigator.getBattery) navigator.getBattery().then(b => log(`battery   ${Math.round(b.level * 100)}% ${b.charging ? 'charging' : 'not charging'}`)).catch(() => {});
  return lines.join('\n');
}

let netBytes = null;
async function net() {
  netBytes ??= await fetch('/nets/value.bin?2').then(r => { if (!r.ok) throw new Error(r.statusText); return r.arrayBuffer(); });
  return netBytes;
}

const fmt = t => Object.entries(t).filter(([k]) => k !== 'sink').map(([k, v]) => `  ${k.padEnd(22)}${v.toFixed(1).padStart(9)} ms`).join('\n');

function worker(suits) {
  const w = new Worker('/bench-worker.js', { type: 'module' });
  const copy = netBytes.slice(0);
  w.postMessage({ net: copy, suits }, [copy]);
  let next = 1;
  const waiting = new Map();
  w.onmessage = ({ data }) => { waiting.get(data.id)(data); waiting.delete(data.id); };
  w.onerror = e => { log(`worker error: ${e.message}`); };
  w.ask = msg => new Promise(resolve => { const id = next++; waiting.set(id, resolve); w.postMessage({ id, ...msg }); });
  return w;
}

// A pool as analysis.js's: one piece of work per worker at a time, in order,
// work with a rank() only when nothing of rank 0 waits (see findMistakes).
function pool(n, suits) {
  const ws = Array.from({ length: n }, () => worker(suits)), idle = [...ws], queue = [], busy = { ms: 0 };
  const pump = () => {
    while (idle.length && queue.length) {
      let pick = -1;
      for (let i = 0; i < queue.length; i++) {
        const r = queue[i].rank?.() ?? 0;
        if (r < 0) { queue.splice(i--, 1)[0].resolve(null); continue; }
        if (r === 0) { pick = i; break; }
        if (pick < 0) pick = i;
      }
      if (pick < 0) break;
      const w = idle.pop(), { msg, resolve } = queue.splice(pick, 1)[0];
      const t = performance.now();
      w.ask(msg).then(d => { busy.ms += performance.now() - t; idle.push(w); resolve(d); pump(); });
    }
  };
  return { run: (msg, rank) => new Promise(resolve => { queue.push({ msg, resolve, rank }); pump(); }), close: () => ws.forEach(w => w.terminate()), busy };
}

// The whole analysis of a game of the cheap line player's (which has some
// mistakes to find), as analysis.js runs it (but for the cards' biggest
// swing), each phase timed. `spare`: as findMistakes takes it (0: idle
// workers play no guesses).
async function whole(suits, n, spare) {
  const moves = played(suits, SEED, fastConfig(suits)), data = prepare(suits, SEED, moves), N = moves.length;
  const p = pool(n, suits), t = { start: performance.now() };
  const mark = name => { t[name] = performance.now(); };
  // A first piece of work, so that the workers have started.
  await Promise.all(Array.from({ length: n }, () => p.run({ value: [data.jobs[0].enc] })));
  mark('workers up');
  const values = new Map(), batches = [];
  for (let i = 0; i < data.jobs.length; i += 6) batches.push(data.jobs.slice(i, i + 6));
  await Promise.all(batches.map(async b => { const { values: v } = await p.run({ value: b.map(j => j.enc) }); b.forEach((j, i) => values.set(j.key, v[i])); }));
  mark(`value ${data.jobs.length} positions`);
  const job = at => ({ ...stretchJob(suits, SEED, moves, data, at), seed: (SEED % 1000003) * 131 + at });
  const asked = data.stretches.map((_, at) => job(at));
  const answers = await Promise.all(Array.from({ length: Math.ceil(asked.length / 4) }, (_, i) => p.run({ track: asked.slice(4 * i, 4 * i + 4) })));
  const cuts = answers.flatMap(a => a.tracks);
  mark(`track ${asked.length} stretches`);
  const theirs = new Map(), asks = screenJobs(suits, SEED, moves, data.stretches, cuts);
  await Promise.all(Array.from({ length: Math.ceil(asks.length / 6) }, async (_, i) => {
    const b = asks.slice(6 * i, 6 * i + 6), { values: v } = await p.run({ value: b.map(j => j.enc) });
    b.forEach((j, k) => theirs.set(j.at, { value: v[k], shows: j.shows }));
  }));
  mark('screen');
  const busy0 = p.busy.ms;
  let spent = 0, rolls = 0, dropped = 0;
  const roll = (r, rank) => p.run({ roll: r }, rank).then(a => { if (a) rolls++; else dropped++; return a && a.rolls; });
  const found = await findMistakes({ stretches: data.stretches, cuts, job, roll, spare, prior: screen(data.stretches, values, theirs, data.won, N, suits), update: (c, k) => { spent = k; } });
  mark(`play out ${spent} games`);
  const use = (p.busy.ms - busy0) / (n * (t[`play out ${spent} games`] - t.screen));
  p.close();
  const names = Object.keys(t);
  const lines = names.slice(1).map((k, i) => `  ${k.padEnd(28)}${((t[k] - t[names[i]]) / 1000).toFixed(2).padStart(8)} s`);
  lines.push(`  ${'total'.padEnd(28)}${((t[names.at(-1)] - t.start) / 1000).toFixed(2).padStart(8)} s`);
  lines.push(`  (${rolls} roll jobs played, ${dropped} dropped; the workers busy ${Math.round(use * 100)}% of the time playing out; ${found.length} mistakes found: ${found.map(m => `move ${m.move} ${(m.cost.mean * 100).toFixed(1)}`).join(', ') || 'none'})`);
  return lines.join('\n');
}

// The network's first linear layer for a position at its largest (321
// tokens, 80 to 240: 6.2 million multiplications), as bench.wasm has it
// (tools/benchwasm). (A real position has a token for each card out, some
// 60 to 100, and its forward pass is some twenty such layers' work.)
const T = 321, FROM = 80, TO = 240;
function linearJs(reps) {
  const x = new Float32Array(T * FROM), w = new Float32Array(TO * FROM), y = new Float32Array(T * TO);
  for (let i = 0; i < x.length; i++) x[i] = (i % 17) * 0.01;
  for (let i = 0; i < w.length; i++) w[i] = (i % 13) * 0.02 - 0.1;
  let total = 0;
  for (let r = 0; r < reps; r++) {
    for (let t = 0; t < T; t++) {
      for (let o = 0; o < TO; o++) {
        let s = 0;
        for (let k = 0; k < FROM; k++) s += w[o * FROM + k] * x[t * FROM + k];
        y[t * TO + o] = s;
      }
    }
    total += y[r % y.length];
  }
  return total;
}

async function wasmAndGpu() {
  const lines = [], per = (ms, n) => `${(ms / n).toFixed(2)} ms a layer`;
  const timed = f => { const t = performance.now(); f(); return performance.now() - t; };
  linearJs(1);
  const js = timed(() => linearJs(3));
  lines.push(`  ${'JavaScript'.padEnd(12)}${per(js, 3)}`);
  if (typeof WebAssembly === 'undefined') lines.push('  WebAssembly  NOT AVAILABLE');
  else {
    try {
      const { instance } = await WebAssembly.instantiate(await fetch('/bench.wasm').then(r => r.arrayBuffer()));
      const linear = instance.exports.linear;
      linear(1);
      const ms = timed(() => linear(3));
      lines.push(`  ${'WebAssembly'.padEnd(12)}${per(ms, 3)}: ${(js / ms).toFixed(1)}x JavaScript`);
    } catch (e) { lines.push(`  WebAssembly  FAILED: ${e.message}`); }
  }
  if (!navigator.gpu) { lines.push('  WebGPU       NOT AVAILABLE (no navigator.gpu)'); return lines.join('\n'); }
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) { lines.push('  WebGPU       NO ADAPTER'); return lines.join('\n'); }
    const info = adapter.info ?? {};
    lines.push(`  WebGPU       ${[info.vendor, info.architecture, info.device, info.description].filter(Boolean).join(' / ') || '(no adapter info)'}`);
    const device = await adapter.requestDevice();
    // The layer for a batch of B positions at once, one output per invocation.
    const B = 24, M = B * T;
    const x = new Float32Array(M * FROM), w = new Float32Array(TO * FROM);
    for (let i = 0; i < x.length; i++) x[i] = ((i % (T * FROM)) % 17) * 0.01;
    for (let i = 0; i < w.length; i++) w[i] = (i % 13) * 0.02 - 0.1;
    const buf = (data, usage) => { const b = device.createBuffer({ size: data.byteLength, usage, mappedAtCreation: true }); new Float32Array(b.getMappedRange()).set(data); b.unmap(); return b; };
    const S = GPUBufferUsage.STORAGE, bx = buf(x, S), bw = buf(w, S);
    const by = device.createBuffer({ size: M * TO * 4, usage: S | GPUBufferUsage.COPY_SRC });
    const back = device.createBuffer({ size: M * TO * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const module = device.createShaderModule({ code: `
      @group(0) @binding(0) var<storage, read> x: array<f32>;
      @group(0) @binding(1) var<storage, read> w: array<f32>;
      @group(0) @binding(2) var<storage, read_write> y: array<f32>;
      @compute @workgroup_size(8, 8)
      fn main(@builtin(global_invocation_id) g: vec3u) {
        if (g.x >= ${M}u || g.y >= ${TO}u) { return; }
        var s = 0.0;
        for (var k = 0u; k < ${FROM}u; k++) { s += x[g.x * ${FROM}u + k] * w[g.y * ${FROM}u + k]; }
        y[g.x * ${TO}u + g.y] = s;
      }` });
    const pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' } });
    const group = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [bx, bw, by].map((buffer, binding) => ({ binding, resource: { buffer } })) });
    const go = async reps => {
      const enc = device.createCommandEncoder(), pass = enc.beginComputePass();
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, group);
      for (let r = 0; r < reps; r++) pass.dispatchWorkgroups(Math.ceil(M / 8), Math.ceil(TO / 8));
      pass.end();
      enc.copyBufferToBuffer(by, 0, back, 0, M * TO * 4);
      device.queue.submit([enc.finish()]);
      await back.mapAsync(GPUMapMode.READ);
      const y = new Float32Array(back.getMappedRange().slice(0));
      back.unmap();
      return y;
    };
    await go(1); // (compiles the shader)
    const t = performance.now(), y = await go(10), ms = performance.now() - t;
    // Checked against the same on the CPU, for one position.
    let worst = 0;
    for (let o = 0; o < TO; o++) for (const tk of [0, 160, T - 1]) {
      let s = 0;
      for (let k = 0; k < FROM; k++) s += w[o * FROM + k] * x[tk * FROM + k];
      worst = Math.max(worst, Math.abs(s - y[(5 * T + tk) * TO + o]));
    }
    lines.push(`  ${''.padEnd(12)}${(ms / 10).toFixed(1)} ms for ${B} positions' layer at once (with the copy back), so ${(ms / 10 / B).toFixed(2)} ms a layer: ${(js / 3 / (ms / 10 / B)).toFixed(1)}x JavaScript; ${worst < 1e-3 ? 'the same as on the CPU' : `WRONG by ${worst}`}`);
    device.destroy();
  } catch (e) { lines.push(`  WebGPU       FAILED: ${e.message}`); }
  return lines.join('\n');
}

async function run(full) {
  for (const b of document.querySelectorAll('button')) b.disabled = b.id !== 'copy';
  out.textContent = '';
  hidden = 0;
  const suits = +document.getElementById('suits').value;
  try {
    log(env());
    log(`suits     ${suits}   seed ${SEED}\n`);
    const t0 = performance.now();
    await net();
    log(`network fetched in ${(performance.now() - t0).toFixed(0)} ms (${netBytes.byteLength} bytes)\n`);
    await new Promise(r => setTimeout(r, 50));
    log('ON THE PAGE (best of 2)');
    const page = suite(netBytes, { suits, seed: SEED, reps: 2 });
    log(fmt(page));
    // Compiled, the integer loop takes about a nanosecond a turn and the
    // float loop's Math.exp several; interpreted, both take some twenty.
    const intNs = page['int loop'] / 2e7 * 1e6, floatNs = page['float loop'] / 2e6 * 1e6;
    log(`  -> ${intNs.toFixed(1)} ns a turn of the integer loop, ${floatNs.toFixed(1)} of the float loop: ${intNs > 5 && intNs > floatNs / 3 ? 'JAVASCRIPT LOOKS INTERPRETED (the optimizer is off: Advanced Protection, or a site setting or policy)' : 'compiled'}`);
    log('\nTHE NETWORK\'S FIRST LAYER, ON THE PAGE (321 tokens)');
    log(await wasmAndGpu());
    await new Promise(r => setTimeout(r, 50));
    const one = worker(suits);
    log('\nONE WORKER (best of 2)');
    log(fmt((await one.ask({ suite: { suits, seed: SEED, reps: 2 } })).times));
    one.terminate();
    const counts = [...new Set([2, 4, Math.max(1, Math.min(12, cores - 1)), cores].filter(n => n >= 2 && n <= 16))].sort((a, b) => a - b);
    for (const n of counts) {
      const ws = Array.from({ length: n }, () => worker(suits));
      await Promise.all(ws.map(w => w.ask({ suite: { suits, seed: SEED, reps: 1 } }))); // warm up
      const s = performance.now();
      const res = await Promise.all(ws.map(w => w.ask({ suite: { suits, seed: SEED, reps: 1 } })));
      const wall = performance.now() - s;
      ws.forEach(w => w.terminate());
      const col = k => res.map(r => r.times[k]).sort((a, b) => a - b);
      const span = k => { const v = col(k); return `${v[0].toFixed(0)}–${v.at(-1).toFixed(0)} ms (median ${v[v.length >> 1].toFixed(0)})`; };
      log(`\n${n} WORKERS AT ONCE: ${wall.toFixed(0)} ms in all`);
      for (const k of ['int loop', 'net 24 positions', 'play a game', 'roll 4 worlds']) log(`  ${k.padEnd(22)}${span(k)}`);
    }
    if (full) {
      const n = Math.max(1, Math.min(12, cores - 1) || 3);
      log(`\nWHOLE ANALYSIS (${n} workers, as the page uses: idle workers play guesses)`);
      log(await whole(suits, n, 2 * n));
      log(`\nWHOLE ANALYSIS (${n} workers, no guesses)`);
      log(await whole(suits, n, 0));
    }
    log(`\nDONE${hidden ? `  (the page was hidden ${hidden} time(s) during the run: the times may be off)` : ''}`);
  } catch (e) {
    log(`\nFAILED: ${e.stack || e}`);
  }
  for (const b of document.querySelectorAll('button')) b.disabled = false;
}

document.getElementById('go').onclick = () => run(true);
document.getElementById('quick').onclick = () => run(false);
document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(out.textContent); document.getElementById('copy').textContent = 'Copied'; }
  catch { getSelection().selectAllChildren(out); }
};
out.textContent = env();
</script>
</body>
</html>
