[package]
name = "spider-wasm"
version = "0.1.0"
edition = "2021"
description = "The web analysis's line player and network in WebAssembly (static/spider.wasm)"

[lib]
crate-type = ["cdylib"]

[dependencies]
spider = { path = "../.." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
