[package]
name = "spider-web"
version = "0.1.0"
edition = "2021"
description = "Web Spider Solitaire for friends: static client, accounts, recorded wins"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
